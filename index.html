<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="top top__index center">
        <header class="header">
            <h1 class="top__title">
                Добро пожаловать на&nbsp;мой сайт мини-игр
            </h1>
            <div class="top__entry">
                Тебе предстоит пройти несколько увлекательных игр. Если готов, нажимай <strong>«Поехали!»</strong> и <strong>приступай.</strong>
            </div>
            <a class="top__link" href="#">
                <button class="top__button">Поехали!</button>
            </a>
        </header>
    </section>
    <section class="about-games center">
        <h2 class="about-games__title">
            Об играх
        </h2>
        <p class="about-games__descriptions">В моей коллекции представлено 6 игр на разные темы.Игры несложные — в них может поиграть каждый.
Все игры доступны для пользования.</p>
        <div class="about-games__cards">
            <article class="about-games__article">
                <img class="about-games__img" src="./img/Обложка карточки.png" alt="">
                <button class="about-games__button">
                    Игра № 1
                </button>
                <p class="about-games__description">
                    Угадай число
                </p>
            </article>
        </div>
    </section>
</body>
</html>
